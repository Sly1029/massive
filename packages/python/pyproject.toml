[project]
name = "massive-workflows"
version = "0.1.0"
description = "Typed, portable workflow authoring for Massive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/Sly1029/massive"
Issues = "https://github.com/Sly1029/massive/issues"

[project.scripts]
massive = "massive.cli:main"
massive-python-frontend = "massive.frontend:main"
massive-python-runner = "massive.runner:main"

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35,<2",
  "pytest>=8.3,<9",
  "pyright>=1.1.390,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massive"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP046"]

[tool.pyright]
include = ["src", "tests/typecheck"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
