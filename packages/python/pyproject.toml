[project]
name = "massive-workflows"
version = "0.1.0"
description = "Typed Python workflows that run locally or on Argo Workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Jayaram" }]
keywords = ["workflow", "dag", "pipeline", "orchestration", "argo", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "botocore>=1.35.10,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.12,<3",
  "typing-extensions>=4.14.1,<5",
]

[project.urls]
Homepage = "https://github.com/Sly1029/massive"
Documentation = "https://github.com/Sly1029/massive/blob/main/packages/python/README.md"
Repository = "https://github.com/Sly1029/massive"
Issues = "https://github.com/Sly1029/massive/issues"

[project.scripts]
massive = "massive.cli:main"
massive-python-frontend = "massive.frontend:main"
massive-python-runner = "massive.runner:main"

[dependency-groups]
dev = [
  "boto3>=1.35.10,<2",
  "boto3-stubs[s3]>=1.35,<2",
  "pytest>=8.3,<9",
  "pyright>=1.1.390,<2",
  "ruff>=0.9,<1",
  "hypothesis>=6.130,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massive"]
exclude = ["src/massive/AGENTS.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP046"]

[tool.pyright]
include = ["src", "tests/typecheck"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
