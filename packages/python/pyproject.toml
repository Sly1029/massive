[project]
name = "massive"
version = "0.1.0"
description = "Typed, portable workflow authoring for Massive"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
]

[project.scripts]
massive-python-runner = "massive.runner:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyright>=1.1.390,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["UP046"]

[tool.pyright]
include = ["src", "tests/typecheck"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
