name: Platforms

# Process ownership and source snapshots differ per OS; run the matrix only when
# the code that owns them changes.
on:
  pull_request:
    paths:
      - "cmd/massive/**"
      - "internal/taskprocess/**"
      - "internal/orchestrator/**"
      - "internal/controlplane/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-processes:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify source snapshot installation
        run: go test ./internal/orchestrator -run 'TestPathWithinMissingTargetUnderSymlinkedRoot|TestEnsureSourceSnapshotInstallsReadOnlyTree' -count=1
      - if: runner.os != 'Windows'
        run: go test -race -count=10 -timeout=5m ./internal/taskprocess
      - if: runner.os == 'Windows'
        run: go test -count=10 -timeout=5m ./internal/taskprocess
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --project packages/python --frozen
      - if: runner.os != 'Windows'
        run: go test -race -count=3 -timeout=5m ./internal/controlplane -run 'TestCancelled|TestFailedRunTerminal|TestFrontendOwns'
      - if: runner.os == 'Windows'
        run: go test -count=3 -timeout=5m ./internal/controlplane -run 'TestCancelled|TestFailedRunTerminal|TestFrontendOwns'
