name: Release

# A pushed v<version> tag publishes to PyPI; a manual run publishes to TestPyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - if: github.event_name == 'push'
        name: Match tag to package version
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("packages/python/pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./scripts/build-python-release.sh dist/python-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release
          path: dist/python-release/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, wheel: manylinux_2_17_x86_64 }
          - { runner: ubuntu-24.04-arm, wheel: manylinux_2_17_aarch64 }
          - { runner: macos-15-intel, wheel: macosx_13_0_x86_64 }
          - { runner: macos-15, wheel: macosx_13_0_arm64 }
          - { runner: windows-2025, wheel: win_amd64 }
          - { runner: windows-11-arm, wheel: win_arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      WHEEL: dist/python-release/massive_workflows-*-py3-none-${{ matrix.wheel }}.whl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release
          path: dist/python-release/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - if: runner.os != 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: runner.os != 'Windows'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: runner.os != 'Windows'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: runner.os != 'Windows'
        run: |
          pnpm install --frozen-lockfile
          ./scripts/test-python-distribution.sh $WHEEL
      # The distribution test drives POSIX shims; Windows proves the wheel's
      # native executable installs and runs a real workflow.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/Scripts/python.exe" $WHEEL
          version="$("$RUNNER_TEMP/venv/Scripts/python.exe" -c 'from importlib.metadata import version; print(version("massive-workflows"))' | tr -d '\r')"
          test "$("$RUNNER_TEMP/venv/Scripts/massive.exe" version | tr -d '\r')" = "massive $version"
          cd conformance/workflows/python-linear
          "$RUNNER_TEMP/venv/Scripts/massive.exe" run workflow.py --input '{"value": 41}' \
            --store "$RUNNER_TEMP/store" --project massive/release-smoke --run-id smoke --json \
            > "$RUNNER_TEMP/result.json"
          "$RUNNER_TEMP/venv/Scripts/python.exe" -c 'import json, sys; run = json.load(open(sys.argv[1])); assert run["status"] == "succeeded" and run["result"] == {"value": 42}, run' "$RUNNER_TEMP/result.json"

  publish-pypi:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/massive-workflows/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/massive-workflows/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
