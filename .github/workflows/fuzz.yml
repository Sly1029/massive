name: Fuzz graphs, journals, and invocation protocols

# PRs get a short smoke run when fuzzed code changes; the nightly run is the campaign.
on:
  pull_request:
    paths:
      - "internal/**"
      - "conformance/schema/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: execution-fuzz-${{ runner.os }}-${{ github.run_id }}
          restore-keys: execution-fuzz-${{ runner.os }}-
      - run: ./scripts/fuzz.sh
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '120s' || '15s' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: execution-fuzz-reproducers
          path: |
            internal/**/testdata/fuzz/**
            conformance/schema/testdata/fuzz/**
          if-no-files-found: ignore

  python-properties:
    # `pnpm check` replays the derandomized `ci` Hypothesis profile on every
    # change; this job explores randomly and keeps failing examples.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --project packages/python --frozen
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis/examples
          key: python-properties-${{ runner.os }}-${{ github.run_id }}
          restore-keys: python-properties-${{ runner.os }}-
      - name: Run nightly Hypothesis profile
        shell: bash
        run: |
          set -o pipefail
          uv run --project packages/python --frozen pytest -q \
            packages/python/tests/test_graph_properties.py --hypothesis-show-statistics \
            2>&1 | tee hypothesis-report.txt
        env:
          MASSIVE_HYPOTHESIS_PROFILE: nightly
          MASSIVE_HYPOTHESIS_DATABASE: .hypothesis/examples
      # Save even after a failure so the shrunk example replays first next night.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .hypothesis/examples
          key: python-properties-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: python-property-failures
          path: |
            hypothesis-report.txt
            .hypothesis/examples
          include-hidden-files: true
          if-no-files-found: ignore
