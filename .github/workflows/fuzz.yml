name: Fuzz graphs, journals, and invocation protocols

# PRs get a short smoke run when fuzzed code changes; the nightly run is the campaign.
on:
  pull_request:
    paths:
      - "internal/**"
      - "conformance/schema/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: execution-fuzz-${{ runner.os }}-${{ github.run_id }}
          restore-keys: execution-fuzz-${{ runner.os }}-
      - run: ./scripts/fuzz.sh
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '120s' || '15s' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: execution-fuzz-reproducers
          path: |
            internal/**/testdata/fuzz/**
            conformance/schema/testdata/fuzz/**
          if-no-files-found: ignore
